<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>抖音发布测试页</title>
  </head>
  <body>
    <button type="button">发布视频</button>
    <input id="media" type="file" accept="video/*">
    <input id="title" placeholder="填写作品标题">
    <label>
      <input id="schedule-switch" type="checkbox">
      定时发布
    </label>
    <input id="schedule-time" placeholder="选择发布时间" value="">
    <div
      id="body"
      contenteditable="true"
      data-placeholder="添加作品描述"
    ></div>
    <button type="button">发布</button>
  </body>
</html>
